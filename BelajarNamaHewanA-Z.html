<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Hewan A-Z</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap');
        
        body {
            font-family: 'Comic Neue', cursive;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        
        .animal-card {
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        
        .animal-card:hover {
            transform: translateY(-5px);
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #FF9A8B 0%, #FF6B95 50%, #FF8E53 100%);
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 105, 149, 0.4);
        }
        
        .correct-answer {
            animation: correctAnim 0.5s ease;
        }
        
        .wrong-answer {
            animation: wrongAnim 0.5s ease;
        }
        
        @keyframes correctAnim {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        @keyframes wrongAnim {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        
        .progress-bar {
            height: 10px;
            border-radius: 5px;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            transition: width 0.5s ease;
        }
    </style>
</head>
<body class="p-4">
    <div class="max-w-md mx-auto bg-white rounded-3xl overflow-hidden shadow-lg animal-card">
        <!-- Header -->
        <div class="bg-gradient-to-r from-purple-400 via-pink-500 to-red-500 p-6 text-center">
            <h1 class="text-3xl font-bold text-white">Belajar Hewan A-Z</h1>
            <p class="text-white mt-2">Tebak nama hewan berdasarkan hurufnya!</p>
        </div>
        
        <!-- Progress Bar -->
        <div class="px-6 pt-4">
            <div class="mb-2 flex justify-between">
                <span class="text-sm font-medium">Progress</span>
                <span id="progress-text" class="text-sm font-medium">1/26</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5">
                <div id="progress-bar" class="progress-bar h-2.5 rounded-full" style="width: 3.85%"></div>
            </div>
        </div>
        
        <!-- Animal Content -->
        <div class="p-6">
            <div class="text-center mb-6">
                <div class="text-8xl font-bold text-yellow-500 mb-2" id="current-letter">A</div>
                <div class="text-xl font-semibold text-gray-700">Hewan apa yang dimulai dengan huruf ini?</div>
            </div>
            
            <div class="flex justify-center mb-6">
                <img id="animal-image" src="https://i.imgur.com/e1GEdRQ.jpeg" alt="Animal" class="h-48 w-48 object-cover rounded-full border-4 border-yellow-400 shadow-md">
            </div>
            
            <div class="mb-4">
                <input type="text" id="answer-input" placeholder="Ketik jawabanmu di sini..." 
                    class="w-full px-4 py-3 rounded-full border-2 border-gray-300 focus:outline-none focus:border-yellow-400 text-lg">
            </div>
            
            <div id="feedback" class="text-center text-xl font-bold mb-4 hidden"></div>
            
            <button id="check-btn" class="btn-primary w-full py-3 px-4 rounded-full text-white font-bold text-lg focus:outline-none">
                <i class="fas fa-check-circle mr-2"></i>Cek Jawaban
            </button>
            
            <button id="next-btn" class="hidden w-full mt-4 py-3 px-4 rounded-full bg-green-500 text-white font-bold text-lg focus:outline-none">
                Lanjut <i class="fas fa-arrow-right ml-2"></i>
            </button>
        </div>
        
        <!-- Footer -->
        <div class="bg-gray-100 px-6 py-4 text-center">
            <div class="flex justify-center space-x-4">
                <button id="hint-btn" class="text-blue-500 hover:text-blue-700">
                    <i class="fas fa-lightbulb text-2xl"></i>
                    <div class="text-xs mt-1">Petunjuk</div>
                </button>
                <button id="sound-btn" class="text-purple-500 hover:text-purple-700">
                    <i class="fas fa-volume-up text-2xl"></i>
                    <div class="text-xs mt-1">Dengar</div>
                </button>
                <button id="reset-btn" class="text-red-500 hover:text-red-700">
                    <i class="fas fa-redo text-2xl"></i>
                    <div class="text-xs mt-1">Ulangi</div>
                </button>
            </div>
        </div>
    </div>
    
    <script>
        // Animal data
        const animals = [
            { letter: 'A', name: 'Ayam', image: 'https://i.imgur.com/e1GEdRQ.jpeg' },
            { letter: 'B', name: 'Bebek', image: 'https://i.imgur.com/IgMmUbG.jpeg' },
            { letter: 'C', name: 'Cicak', image: 'https://i.imgur.com/7fzCAUw.jpeg' },
            { letter: 'D', name: 'Domba', image: 'https://i.imgur.com/ND6iJT8.jpeg' },
            { letter: 'E', name: 'Elang', image: 'https://i.imgur.com/ne3bdEZ.jpeg' },
            { letter: 'F', name: 'Flamingo', image: 'https://i.imgur.com/uGPinaG.jpeg' },
            { letter: 'G', name: 'Gajah', image: 'https://i.imgur.com/luUssVm.jpeg' },
            { letter: 'H', name: 'Harimau', image: 'https://i.imgur.com/1JYKdWW.jpeg' },
            { letter: 'I', name: 'Itik', image: 'https://i.imgur.com/5awwlX3.jpeg' },
            { letter: 'J', name: 'Jerapah', image: 'https://i.imgur.com/vpv1BPa.jpeg' },
            { letter: 'K', name: 'Kucing', image: 'https://i.imgur.com/TsQamLf.jpeg' },
            { letter: 'L', name: 'Lalat', image: 'https://i.imgur.com/9nyFhSO.jpeg' },
            { letter: 'M', name: 'Monyet', image: 'https://i.imgur.com/Kl8yrKP.jpeg' },
            { letter: 'N', name: 'Nyamuk', image: 'https://i.imgur.com/gVYL0KE.jpeg' },
            { letter: 'O', name: 'Orangutan', image: 'https://i.imgur.com/kXH5YiJ.jpeg' },
            { letter: 'P', name: 'Panda', image: 'https://i.imgur.com/TitP85p.jpeg' },
            { letter: 'Q', name: 'Quokka', image: 'https://i.imgur.com/A0W3GkT.jpeg' },
            { letter: 'R', name: 'Rusa', image: 'https://i.imgur.com/Z6jMH2t.jpeg' },
            { letter: 'S', name: 'Singa', image: 'https://i.imgur.com/pgew3a4.jpeg' },
            { letter: 'T', name: 'Tikus', image: 'https://i.imgur.com/NdHmn9f.jpeg' },
            { letter: 'U', name: 'Ular', image: 'https://i.imgur.com/49QxGrh.jpeg' },
            { letter: 'V', name: 'Viper', image: 'https://i.imgur.com/JhmtiqB.jpeg' },
            { letter: 'W', name: 'Walrus', image: 'https://i.imgur.com/1xRO9rx.jpeg' },
            { letter: 'X', name: 'Xerus', image: 'https://i.imgur.com/JiGlHAn.jpeg' },
            { letter: 'Y', name: 'Yak', image: 'https://i.imgur.com/tjbTXSJ.jpeg' },
            { letter: 'Z', name: 'Zebra', image: 'https://i.imgur.com/jFHd41i.jpeg' }
        ];
        
        // DOM elements
        const currentLetterEl = document.getElementById('current-letter');
        const animalImageEl = document.getElementById('animal-image');
        const answerInputEl = document.getElementById('answer-input');
        const checkBtnEl = document.getElementById('check-btn');
        const nextBtnEl = document.getElementById('next-btn');
        const feedbackEl = document.getElementById('feedback');
        const progressTextEl = document.getElementById('progress-text');
        const progressBarEl = document.getElementById('progress-bar');
        const hintBtnEl = document.getElementById('hint-btn');
        const soundBtnEl = document.getElementById('sound-btn');
        const resetBtnEl = document.getElementById('reset-btn');
        
        // App state
        let currentIndex = 0;
        let score = 0;
        
        // Initialize the app
        function init() {
            updateAnimal();
            updateProgress();
            
            // Focus on input field
            answerInputEl.focus();
        }
        
        // Update animal display
        function updateAnimal() {
            const currentAnimal = animals[currentIndex];
            currentLetterEl.textContent = currentAnimal.letter;
            animalImageEl.src = currentAnimal.image;
            animalImageEl.alt = currentAnimal.name;
            answerInputEl.value = '';
            feedbackEl.classList.add('hidden');
            nextBtnEl.classList.add('hidden');
        }
        
        // Update progress
        function updateProgress() {
            const progress = ((currentIndex + 1) / animals.length) * 100;
            progressTextEl.textContent = `${currentIndex + 1}/${animals.length}`;
            progressBarEl.style.width = `${progress}%`;
        }
        
        // Check answer
        function checkAnswer() {
            const userAnswer = answerInputEl.value.trim().toLowerCase();
            const correctAnswer = animals[currentIndex].name.toLowerCase();
            
            if (userAnswer === '') {
                feedbackEl.textContent = 'Silakan ketik jawabanmu!';
                feedbackEl.className = 'text-center text-xl font-bold mb-4 text-yellow-500';
                feedbackEl.classList.remove('hidden');
                return;
            }
            
            if (userAnswer === correctAnswer) {
                // Correct answer
                feedbackEl.textContent = '✅ Benar!';
                feedbackEl.className = 'text-center text-xl font-bold mb-4 text-green-500 correct-answer';
                feedbackEl.classList.remove('hidden');
                nextBtnEl.classList.remove('hidden');
                checkBtnEl.classList.add('hidden');
                score++;
                
                // Auto proceed to next after 1.5 seconds
                setTimeout(() => {
                    if (currentIndex < animals.length - 1) {
                        nextAnimal();
                    } else {
                        showCompletion();
                    }
                }, 1500);
            } else {
                // Wrong answer
                feedbackEl.textContent = '❌ Salah, coba lagi.';
                feedbackEl.className = 'text-center text-xl font-bold mb-4 text-red-500 wrong-answer';
                feedbackEl.classList.remove('hidden');
                answerInputEl.focus();
            }
        }
        
        // Go to next animal
        function nextAnimal() {
            if (currentIndex < animals.length - 1) {
                currentIndex++;
                updateAnimal();
                updateProgress();
                checkBtnEl.classList.remove('hidden');
                answerInputEl.focus();
            } else {
                showCompletion();
            }
        }
        
        // Show completion message
        function showCompletion() {
            feedbackEl.textContent = `🎉 Selamat! Kamu menyelesaikan semua hewan dengan skor ${score}/${animals.length}!`;
            feedbackEl.className = 'text-center text-xl font-bold mb-4 text-purple-500';
            feedbackEl.classList.remove('hidden');
            checkBtnEl.classList.add('hidden');
            nextBtnEl.classList.add('hidden');
        }
        
        // Give hint
        function giveHint() {
            const currentAnimal = animals[currentIndex];
            const hintLength = Math.min(3, currentAnimal.name.length);
            const hint = currentAnimal.name.substring(0, hintLength) + '...';
            
            feedbackEl.textContent = `Petunjuk: ${hint}`;
            feedbackEl.className = 'text-center text-xl font-bold mb-4 text-blue-500';
            feedbackEl.classList.remove('hidden');
        }
        
        // Speak animal name
        function speakAnimalName() {
            const currentAnimal = animals[currentIndex];
            const utterance = new SpeechSynthesisUtterance(currentAnimal.name);
            utterance.lang = 'id-ID';
            speechSynthesis.speak(utterance);
            
            feedbackEl.textContent = `Dengar: ${currentAnimal.name}`;
            feedbackEl.className = 'text-center text-xl font-bold mb-4 text-purple-500';
            feedbackEl.classList.remove('hidden');
        }
        
        // Reset the game
        function resetGame() {
            currentIndex = 0;
            score = 0;
            init();
        }
        
        // Event listeners
        checkBtnEl.addEventListener('click', checkAnswer);
        nextBtnEl.addEventListener('click', nextAnimal);
        hintBtnEl.addEventListener('click', giveHint);
        soundBtnEl.addEventListener('click', speakAnimalName);
        resetBtnEl.addEventListener('click', resetGame);
        
        // Handle Enter key
        answerInputEl.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });
        
        // Initialize the app
        init();
    </script>
</body>
</html>
